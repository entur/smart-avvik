[project]
name = "kix-avvik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.11.0",
    "db-dtypes>=1.7.1",
    "fastapi[standard]>=0.140.2",
    "google-cloud-bigquery-storage>=2.39.0",
    "google-cloud-bigquery[pandas]>=3.42.2",
    "jupyterlab>=4.6.2",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
    "nbformat>=5.10.4",
    "playwright>=1.61.0",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
simulator = [
    "fastapi[standard]>=0.140.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
# The /disruptions API's runtime deps that are not already in [project.dependencies]. What ships in
# the image is installed from disruptions/api/requirements.txt -- this group is not it. They are
# listed again here so a plain `uv sync` yields an environment that can import and run the API and
# its test suites, in an IDE as much as on the command line. Only `py_vapid` and `cryptography` are
# imported at module level (varsel.py, test_varsel_api.py) and both arrive with pywebpush; the rest
# are imported lazily inside functions, so they are here for the IDE and for exercising those paths.
# No tzdata: that entry in requirements.txt exists because python:*-slim ships without an IANA
# database, which a dev machine has. Keep the versions in step with requirements.txt.
api = [
    "pywebpush>=2.3.0",
    "google-cloud-storage>=3.13.0",
    "anthropic[vertex]>=0.69.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.30.0",
]

[tool.uv]
# `api` is a *default* group, so `uv sync` on its own is enough: an IDE pointed at .venv resolves
# the API's imports and runs disruptions/api/test_*.py without anyone remembering an extra flag.
default-groups = ["dev", "api"]

# ruff 0.16 widened its default rule set well beyond E/F (B, UP, SIM, PLR, I, C4, RUF, ...).
# The defaults are adopted as-is; the exemptions below are rules that misfire on a
# framework/tool idiom rather than findings worth fixing.
[tool.ruff]
# docs/togvarsel/analysis/ holds the one-off scripts that produced a dated investigation's numbers,
# kept as the record of how those numbers were arrived at rather than as maintained code. Linting
# them reported 56 findings across 9 rules, every one of them a property of a throwaway script
# (C408 dict() literals, SIM115 unclosed open(), import order) — and two that are the technique
# working as intended: xgb_tune.py exec()s the data-loading half of sweep.py so the two share one
# feature build, which is S102 plus an F821 for every name that arrives that way. Fixing those
# would mean rewriting a script whose output is already committed beside it. The cost of excluding
# rather than exempting per rule is real and worth stating: a genuine bug in a future analysis
# script here will not be caught, so anything promoted out of this directory into code that runs
# more than once should move out of the exclusion with it.
extend-exclude = ["docs/togvarsel/analysis"]

[tool.ruff.lint.flake8-bugbear]
# `param: str = Query(...)` in an endpoint signature is how FastAPI declares query
# parameters — it is not the mutable-default bug B008 looks for.
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: a cell's trailing bare expression IS the cell's rendered output (for the
# eval ones, it is what shows up in the /eval snapshots), so B018 "useless expression" does not
# apply. Only the marimo apps are listed — eval/tune_alert_thresholds.py is a plain script,
# where B018 is a real bug. data/feedback/review_feedback.py is a marimo app that deliberately
# does NOT live in eval/: export_eval.sh globs that directory and commits the rendered HTML,
# which for a page showing travellers' free text would publish it.
#
# PLR1711 is the same kind of exemption for the same reason. Current marimo (0.23.16) closes
# EVERY cell with a `return`, including display-only ones, and `marimo check --fix` re-adds them
# when they are deleted — so stripping them to satisfy the linter lasts exactly until the next
# person opens the file in the editor, and CI then fails on a file nobody meaningfully changed.
# That is not hypothetical: it is how this entry came to exist, on a notebook that had linted
# clean minutes earlier. All four notebooks are listed, and all four are now SAVED in that
# format (2026-08-29) rather than only exempted from complaining about it — the three eval ones
# were written by marimo 0.23.13, which emitted none, so an editor session on any of them would
# otherwise have buried a real change under a 26-42 line reformat. Normalizing them changed no
# cell's defs or refs and no /eval title, and needs no re-render: `return` is not output.
"eval/impact_eval.py" = ["B018", "PLR1711"]
"eval/pooled-model-bus-eval.py" = ["B018", "PLR1711"]
"eval/pooled-model-train-eval.py" = ["B018", "PLR1711"]
"data/feedback/review_feedback.py" = ["B018", "PLR1711"]
