# Base values for the kix-avvik deployment via the Entur common chart.
# Environment-specific overrides live in env/values-kub-ent-{dev,tst,prd}.yaml.
common:
  app: kix-avvik
  shortname: kixavvik        # must match .entur/application.yaml metadata.id
  team: ki-eksperimentering  # team label without the "team-" prefix

  container:
    image: kix-avvik  # replaced with image:tag by gha-helm deploy.yml
    cpu: 0.5
    memory: 1024
    # The chart's default tcpSocket startup probe (300 x 1s) covers the app's
    # slow start: uvicorn only binds the port after the lifespan hook has
    # finished the initial BigQuery impact-lookup load.
    probes:
      liveness:
        path: /health
      readiness:
        path: /health

  deployment:
    # Single instance by design: the app keeps an in-process cache and runs one
    # background poller thread, so more replicas would mean duplicate pollers
    # and unshared caches. forceReplicas=1 uses the Recreate strategy and
    # disables HPA/PDB.
    forceReplicas: 1

  ingress:
    enabled: true
    trafficType: public  # public read-only API

  configmap:
    enabled: true
    data:
      PYTHONUNBUFFERED: "1"
      # All deployments use one named backend. Environment files repeat this explicitly, while the
      # base keeps future/local releases aligned with /meldinger's one-call quota accounting.
      VARSEL_LLM_PROVIDER: gemini
      # Per-alert feedback is a privacy-gated opt-in. This remains false unless an environment has
      # passed the capture/read-back/deletion and access gates in data/feedback/README.md.
      VARSEL_FEEDBACK_ENABLED: "false"
      # Togvarsel rush-forecast pushes to /varsel subscribers. Delivery-flag convention: only
      # true/1/yes/on enable, and the code default for an UNSET value is also off — this value
      # states the posture where an operator looks. Dev opts in; tst/prd stay off (prd would
      # additionally need the runtime tables, see data/queries/copy_runtime_to_prd.sh).
      TOGVARSEL_NOTIFY_ENABLED: "false"
      # Rushvarsel's MASTER gate (deployment.show_rushvarsel), above the flag just above it: while
      # this is off no rush-forecast push is sent, /togmelding and every /togmelding-api route
      # answer 404, and /varsel mentions rushvarsel nowhere. Off in every environment since
      # 2026-09-08 — the product is not ready to be shown, and a partner finding it would be
      # noise. Turning it back on is this one value per environment: the per-environment
      # TOGVARSEL_NOTIFY_ENABLED values above are deliberately left as they were, and the forecast
      # itself keeps being issued and scored either way, so /rushhistorikk keeps measuring the
      # model while the product is dark.
      SHOW_RUSHVARSEL: "false"
      # Non-secret EU ingestion origin. Capture and review credentials stay separate.
      POSTHOG_HOST: https://eu.i.posthog.com
      # Notification webhooks. Same flag convention as the three above: only true/1/yes/on
      # enable, the code default for an UNSET value is also off, and this line states the closed
      # posture where an operator looks. While it is off the notification pass does not touch the
      # store at all -- main injects the gate and varsel declines to read -- so a deployment with
      # this off is byte for byte the pass that ran before the channel existed, which is what the
      # rollback story rests on.
      #
      # Turning it on in an environment needs more than the flag: the Firestore database and its
      # indexes must exist (terraform/firestore.tf, applied per environment), the runtime SA needs
      # roles/datastore.user (.entur/application.yaml -- verify the binding, a filtered role is
      # dropped silently), and the two notification secrets below must exist in Secret Manager BEFORE
      # their names are uncommented here.
      NOTIFICATION_WEBHOOKS_ENABLED: "false"
      # The named Firestore database notification_store.py opens. THE SAME LITERAL LIVES IN
      # terraform/variables.tf's notification_firestore_database default, and it is the one thing
      # Terraform and the runtime cannot share -- disruptions/api/test_notification_store.py greps both
      # files for it. A mismatch is invisible in the worst way: the poller's webhook load is
      # guarded, so it logs one warning per cycle and the deployment reads exactly like a healthy
      # one with nothing registered.
      #
      # Same in every environment because each environment is its own GCP project. Not "(default)":
      # co-managing that database collides with google_app_engine_application, which auto-provisions
      # it as a side effect (see terraform/firestore.tf).
      NOTIFICATION_FIRESTORE_DATABASE: notifications
      # Entur-SSO gate (sso.py) for the internal surfaces /historikk, /meldinger and /demo —
      # pages and APIs both. Same flag convention as the two above: only true/1/yes/on enables,
      # unset is
      # also off, and this line states the posture where an operator looks. Flipping an
      # environment on additionally needs SSO_GOOGLE_CLIENT_ID (configmap) plus
      # SSO_GOOGLE_CLIENT_SECRET and SSO_SESSION_SECRET (Secret Manager, wired like the VAPID
      # keys) — the OAuth client recipe is in sso.py's docstring. "true" WITHOUT those serves the
      # gated surfaces as 503 (fail closed), never publicly; rollback is this flag back to "false".
      SSO_REQUIRED: "false"
