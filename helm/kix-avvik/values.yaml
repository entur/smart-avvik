# Base values for the kix-avvik deployment via the Entur common chart.
# Environment-specific overrides live in env/values-kub-ent-{dev,tst,prd}.yaml.
common:
  app: kix-avvik
  shortname: kixavvik        # must match .entur/application.yaml metadata.id
  team: ki-eksperimentering  # team label without the "team-" prefix

  container:
    image: kix-avvik  # replaced with image:tag by gha-helm deploy.yml
    cpu: 0.5
    memory: 1024
    # The chart's default tcpSocket startup probe (300 x 1s) covers the app's
    # slow start: uvicorn only binds the port after the lifespan hook has
    # finished the initial BigQuery impact-lookup load.
    probes:
      liveness:
        path: /health
      readiness:
        path: /health

  deployment:
    # Single instance by design: the app keeps an in-process cache and runs one
    # background poller thread, so more replicas would mean duplicate pollers
    # and unshared caches. forceReplicas=1 uses the Recreate strategy and
    # disables HPA/PDB.
    forceReplicas: 1

  ingress:
    enabled: true
    trafficType: public  # public read-only API

  configmap:
    enabled: true
    data:
      PYTHONUNBUFFERED: "1"
      # All deployments use one named backend. Environment files repeat this explicitly, while the
      # base keeps future/local releases aligned with /meldinger's one-call quota accounting.
      VARSEL_LLM_PROVIDER: gemini
      # Per-alert feedback is a privacy-gated opt-in. This remains false unless an environment has
      # passed the capture/read-back/deletion and access gates in data/feedback/README.md.
      VARSEL_FEEDBACK_ENABLED: "false"
      # Non-secret EU ingestion origin. Capture and review credentials stay separate.
      POSTHOG_HOST: https://eu.i.posthog.com
