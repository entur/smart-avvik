  - package-ecosystem: "uv"
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directories: ["/", "/[!.]*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
    commit-message:
      prefix: "chore"
      include: "scope"
    # The build stage must match the CPython 3.13 in the distroless runtime image.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

