  - package-ecosystem: "npm"
    directories:
      - "/demo/avviksvarsel"
      - "/demo/meldinger"
      - "/demo/reisedemo"
      - "/demo/rushhistorikk"
      - "/demo/togmelding"
      - "/demo/varselhistorikk"
      - "/integrations/firebase-notifications"
      - "/integrations/notifications-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["@entur/*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # The packages declare node >=24 and the image builds them on node:24-slim.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  #   - package-ecosystem: "bun"
