# One PR per dependency so Freyja can assess and merge it (no groups).
# 4 day cooldown, except for the Entur packages listed under exclude.
# Same file in every repo: comment out the ecosystems the repo does not use.
# Additions to the standard file: the uv block, and the two ignore rules below.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["entur/*"]
    commit-message:
      prefix: "chore"
      include: "scope"

