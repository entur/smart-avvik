# Minor and patch updates are grouped and auto-merged by
# workflows/dependabot-automerge.yml once the required checks pass. Majors are merged by hand.
# The chore(deps) prefix makes the PR titles pass verify-pr in pr.yml.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - "/demo/avviksvarsel"
      - "/demo/meldinger"
      - "/demo/reisedemo"
      - "/demo/rushhistorikk"
      - "/demo/togmelding"
      - "/demo/varselhistorikk"
      - "/integrations/firebase-notifications"
      - "/integrations/notifications-client"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # The @entur packages depend on each other's tokens. A major taken one package
      # at a time leaves two generations in the lockfile, so they come in one PR.
      entur:
        applies-to: version-updates
        patterns: ["@entur/*"]
        update-types: [major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: helm
    directory: "/helm/kix-avvik"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
