# Minor and patch updates are grouped and auto-merged by
# workflows/dependabot-automerge.yml once the required checks pass. Majors are merged by hand.
# The chore(deps) prefix makes the PR titles pass verify-pr in pr.yml.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - "/demo/avviksvarsel"
      - "/demo/meldinger"
      - "/demo/reisedemo"
      - "/demo/rushhistorikk"
      - "/demo/togmelding"
      - "/demo/varselhistorikk"
      - "/integrations/firebase-notifications"
      - "/integrations/notifications-client"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # The @entur packages depend on each other's tokens. A major taken one package
      # at a time leaves two generations in the lockfile, so they come in one PR.
      entur:
        applies-to: version-updates
        patterns: ["@entur/*"]
        update-types: [major]
      # firebase and @firebase/rules-unit-testing peer on each other's major, so neither
      # installs alone.
      firebase:
        applies-to: version-updates
        patterns: ["firebase", "@firebase/*"]
        update-types: [major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node follows the Node major in engines and CI (24). Bump them together by hand,
      # or it types APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # python:3.X-slim builds the venv that runs on the CPython in
      # gcr.io/distroless/python3-debian13 (3.13). Dependabot calls 3.13 -> 3.14 a minor,
      # so without this it auto-merges a venv the runtime cannot load (#331). Move both together.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: helm
    directory: "/helm/smart-avvik"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
