# Paths excluded from GitHub secret scanning.
#
# The webhook channel signs with Standard Webhooks, whose secrets carry the same
# `whsec_` prefix as Stripe's, so the scanner's Stripe pattern fires on the
# cross-language signing vectors. Every value in those files is HMAC-derived from
# the `test_root` published in the same file, re-derived byte for byte by
# disruptions/api/test_webhook_signing.py, and used in no deployment. Alerts
# 1-3, 5 and 6 (2026-09-09) were all this and were closed as used-in-tests.
paths-ignore:
  - "contracts/notifications/v1/signing-vectors.json"
  - "integrations/notifications-client/contracts/signing-vectors.json"
