# Continuous Integration Workflow
#
# This is a reusable workflow (workflow_call) -- it is NOT triggered directly
# by events. It is called by build.yml, on pull requests and on push to main.
#
# Pipeline:
#   1. Lint         -- Dockerfile (hadolint)
#   2. Test         -- ruff lint + the API test suites, in a uv-managed environment
#   3. Docker build -- build the image and keep it as this run's `smart-avvik` artifact
#   4. Docker scan  -- scan it for vulnerabilities
#
# Nothing here pushes or deploys. This repository is public and has no access to Entur's
# registry or clusters: smart-avvik-deployment-config pulls the artifact from this run, pushes it
# to the registry and deploys it. The Helm chart, its lint and its render checks live there too.

name: CI

on:
  workflow_call:

jobs:
  # --- Linting (runs in parallel with test) ---

  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: Dockerfile

  # --- Build and Test ---

  # Runs on Dependabot PRs too.
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          # Every lockfile this job runs `npm ci` against. The input is multi-line by design: naming
          # only one means the other packages' installs are uncached, which is silent -- a slower job
          # is not a failing job, so nothing would ever surface it.
          cache-dependency-path: |
            demo/avviksvarsel/package-lock.json
            integrations/notifications-client/package-lock.json
            integrations/firebase-notifications/package-lock.json
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      # Each suite runs as its OWN process, deliberately. They are hermetic (the BigQuery client is
      # stubbed before main is imported; no network) but they are NOT collection-safe together: the
      # /varsel-api suite sets VAPID env vars at import time, and a single shared interpreter lets
      # module-import order leak between files (measured: a bare `pytest` over the directory fails
      # 16 of 18 checks in test_varsel_api.py). Until this job existed, none of these ran in CI at
      # all and every green tick was lint-only.
      - name: Run API test suites
        working-directory: disruptions/api
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Globbed, not a hardcoded list: a literal list means adding a suite and forgetting this
          # line gives a green build that never ran it -- the same silent gap this job exists to fix.
          # opentelemetry-api is a hard import of main (via tracing_setup); the SDK and the two
          # instrumentors are what test_tracing_setup.py's enabled-path checks drive. The OTLP
          # exporter is deliberately NOT here: no test may build it (the in-memory seam exists
          # for exactly that), and its absence is what proves the lazy-import claim (KTD3).
          for suite in test_*.py; do
            echo "::group::$suite"
            uv run --with fastapi --with httpx --with pydantic \
                   --with google-cloud-bigquery --with google-cloud-storage \
                   --with pywebpush --with google-cloud-firestore \
                   --with prometheus-client --with opentelemetry-api \
                   --with opentelemetry-sdk \
                   --with opentelemetry-instrumentation-fastapi \
                   --with opentelemetry-instrumentation-requests \
                   --with opentelemetry-instrumentation-threading python "$suite"
            echo "::endgroup::"
          done
      # The notification store's EMULATOR-backed checks, which the loop above cannot run: it has no
      # Java and no firebase CLI, so an emulator-dependent suite dropped into it would fail every
      # run. test_notification_store.py therefore runs TWICE -- once in the loop with
      # FIRESTORE_EMULATOR_HOST unset, where it prints a conspicuous line naming how many checks it
      # skipped and exits 0, and once here with the emulator, where the full set runs.
      #
      # A `demo-` project id is what makes this credential-free: the Python server library picks up
      # FIRESTORE_EMULATOR_HOST and skips ADC entirely, and a demo project can reach no real GCP
      # service. `emulators:exec` exports the variable into the wrapped command's environment and
      # tears the emulator down after it, so a non-zero exit is this step's exit.
      #
      # The suite itself greps THIS step (test_the_emulator_step_is_wired_in_ci): a loud skip that
      # nobody ever un-skips is the same silent gap the loop above exists to close, so deleting
      # this step fails the suite rather than quietly halving it.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run notification store tests against the Firestore emulator
        working-directory: disruptions/api
        run: |
          set -euo pipefail
          npm install -g firebase-tools@15
          firebase emulators:exec --project demo-smartavvik --only firestore \
            --config ../../firebase.json \
            'uv run --with fastapi --with httpx --with pydantic \
                    --with google-cloud-bigquery --with google-cloud-storage \
                    --with pywebpush --with google-cloud-firestore python test_notification_store.py'
      # Separate step, and separate from the loop above, because this suite lives outside
      # disruptions/api -- the loop's working-directory made it invisible, and it had no
      # `__main__` runner either, so it was unrun twice over. It guards the export of travellers'
      # free text, which is the most sensitive path in the repo.
      - name: Run feedback export tests
        working-directory: data/feedback
        run: |
          set -euo pipefail
          shopt -s nullglob
          for suite in test_*.py; do
            echo "::group::$suite"
            uv run python "$suite"
            echo "::endgroup::"
          done
      # The load harness under scripts/. Invisible to every loop above -- the API loop enters
      # disruptions/api and the feedback loop enters data/feedback -- which is the same gap the
      # feedback step above was added to close. The suite greps THIS step for itself
      # (test_the_scripts_step_is_wired_in_ci), so deleting it fails the build rather than
      # quietly retiring the checks. No `--with`: the harness is hermetic, and what it imports from
      # disruptions/api (notification_store, notification_auth) needs only what the `uv sync` above
      # already installed -- `api` is a DEFAULT dependency group. The Firestore client itself is a
      # lazy import inside notification_store rather than a module-level one, which is why the
      # suite runs with no emulator and no credentials.
      - name: Run load-harness tests
        working-directory: scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for suite in test_*.py; do
            echo "::group::$suite"
            uv run python "$suite"
            echo "::endgroup::"
          done
      - name: Run Avviksvarsel tests
        working-directory: demo/avviksvarsel
        run: |
          npm ci --no-fund --no-audit
          npm test
      # The two `integrations/` packages -- the TypeScript helper a client vendors, and the Firebase
      # receiver built on it. A suite in a NEW top-level directory is invisible to every loop above:
      # those enter disruptions/api, data/feedback and demo/avviksvarsel only. So these two steps are
      # the whole reason those suites run at all, and each package greps THIS file for its own step
      # (`test/ci.test.mjs`), the same self-grep discipline the emulator step above uses -- deleting a
      # step fails the suite rather than quietly halving the build.
      #
      # `npm ci` needs a committed lockfile per package, which is why there is one in each.
      #
      # The client is BUILT here as well as tested. `npm test` runs `node --test` over the .ts
      # sources through Node's type stripping, with no build step -- a convenience, and explicitly
      # NOT the shape a client consumes. `verify:dist` compiles to CommonJS plus type declarations
      # and loads the artifact, which is the declared consumption shape (KTD11), on the Node major
      # this job pins above.
      - name: Run notification client tests
        working-directory: integrations/notifications-client
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm test
          npm run verify:dist
      # The Firebase receiver: a plain suite, then the emulator suite that asserts the Firestore
      # security rules actually deny a client SDK.
      #
      # Java and firebase-tools are already installed by the notification store steps above; the guard
      # below makes this step work on its own if those are ever removed or reordered, rather than
      # failing with `firebase: command not found` in an unrelated part of the file.
      #
      # This package's firebase.json pins DIFFERENT emulator ports from the repo-root one --
      # firestore 8572, the Firestore websocket 9151 and the hub 4401, against 8571, 9150 and the
      # default 4400 -- and runs under its own demo project id. Two of those three are invisible in
      # the root config: it names no hub, and neither file names the websocket port, which the CLI
      # allocates separately and defaults to 9150 for every project.
      #
      # What that separation is for HERE is the sequential case, which is what this job does: a step
      # stays clean when the previous one has not finished tearing down, and a Firestore emulator has
      # been observed holding its port for minutes after its runner exited. It does NOT make two
      # suites safe to start at the same instant -- the CLI's own hub startup is what fails then --
      # so these two steps must stay sequential, which as separate steps they are.
      - name: Run Firebase notification receiver tests
        working-directory: integrations/firebase-notifications
        run: |
          set -euo pipefail
          command -v firebase >/dev/null || npm install -g firebase-tools@15
          npm ci --no-fund --no-audit
          npm test
          npm run test:emulator
          npm run verify:dist

  # --- Docker Build, Scan, and Push ---
  # Only runs after all lints and tests pass to avoid wasting resources on broken builds

  docker:
    needs: [test, docker-lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      # Context is the repo root: the multi-stage Dockerfile builds the /demo,
      # /varsel, /historikk, /meldinger and /rushvarsel front-ends from
      # demo/reisedemo + demo/avviksvarsel + demo/varselhistorikk +
      # demo/meldinger + demo/togmelding (outside the API dir), then assembles the
      # API image from disruptions/api. All paths are relative to the repository
      # root.
      # Those builds run `tsc -b`, so a TypeScript error fails the image build —
      # there is no separate front-end job.
      context: .
      dockerfile: Dockerfile
      # The commit, baked into the image as GIT_SHA and published as /ready's `version`; the
      # deployment's leader smoke waits for an answer from THIS build. deployment-config tags the
      # pushed image with the same commit (`main.<date>-SHA<first 7>`), which is what the smoke
      # derives its expectation from.
      build_args: GIT_SHA=${{ github.sha }}
      # No GitHub Factory setup here: the repository is public and gets no cloud identity.
      authenticate: false

  # A finding does not block anything; the results are on the PR. Not for pull requests from forks,
  # which get no secrets, and the scan needs the organisation's allowlist key.
  docker-scan:
    needs: [docker]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker.outputs.image_artifact }}
