# Continuous Integration Workflow
#
# This is a reusable workflow (workflow_call) -- it is NOT triggered directly
# by events. It is called by build.yml (on PRs) and cd.yml (on push to main,
# or workflow_dispatch without a pre-built image).
#
# Pipeline:
#   1. Lint (parallel)   -- Dockerfile (hadolint) and Helm chart per environment
#   2. Test              -- ruff lint + the API test suites, in a uv-managed environment
#   3. Docker build      -- build the image from disruptions/api
#   4. Docker scan/push  -- scan for vulnerabilities and push to the registry (parallel)
#
# The output `image_and_tag` is passed back to the caller (cd.yml) so it
# knows which image to deploy.

name: CI

on:
  workflow_call:
    outputs:
      image_and_tag:
        description: Fully qualified image reference
        value: ${{ jobs.docker-push.outputs.image_and_tag }}

jobs:
  # --- Linting (runs in parallel with test) ---

  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: Dockerfile

  # Helm charts are linted per environment to catch env-specific value errors
  helm-lint:
    strategy:
      matrix:
        environment: [dev, tst, prd]
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      chart: helm/kix-avvik
      environment: ${{ matrix.environment }}
      values: values-kub-ent-${{ matrix.environment }}.yaml

  # --- Build and Test ---

  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      # Each suite runs as its OWN process, deliberately. They are hermetic (the BigQuery client is
      # stubbed before main is imported; no network) but they are NOT collection-safe together: the
      # /varsel-api suite sets VAPID env vars at import time, and a single shared interpreter lets
      # module-import order leak between files (measured: a bare `pytest` over the directory fails
      # 16 of 18 checks in test_varsel_api.py). Until this job existed, none of these ran in CI at
      # all and every green tick was lint-only.
      - name: Run API test suites
        working-directory: disruptions/api
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Globbed, not a hardcoded list: a literal list means adding a suite and forgetting this
          # line gives a green build that never ran it -- the same silent gap this job exists to fix.
          for suite in test_*.py; do
            echo "::group::$suite"
            uv run --with fastapi --with httpx --with pydantic \
                   --with google-cloud-bigquery --with google-cloud-storage \
                   --with pywebpush python "$suite"
            echo "::endgroup::"
          done

  # --- Docker Build, Scan, and Push ---
  # Only runs after all lints and tests pass to avoid wasting resources on broken builds

  docker:
    needs: [test, docker-lint, helm-lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      # Context is the repo root: the multi-stage Dockerfile builds the /demo,
      # /varsel and /historikk front-ends from demo/reisedemo + demo/avviksvarsel +
      # demo/varselhistorikk (outside the API dir), then assembles the API image
      # from disruptions/api. All paths are relative to the repository root.
      # Those builds run `tsc -b`, so a TypeScript error fails the image build —
      # there is no separate front-end job.
      context: .
      dockerfile: Dockerfile

  # Scan and push run in parallel -- a vulnerability finding does not block the
  # push, but the scan results are available for review on the PR
  docker-scan:
    needs: [docker]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit
    with:
      image_artifact: ${{ needs.docker.outputs.image_artifact }}

  docker-push:
    needs: [docker]
    uses: entur/gha-docker/.github/workflows/push.yml@v1
    secrets: inherit
