# Build Workflow
#
# Runs ci.yml (lint, tests, image build, scan) on every pull request and on push to main. On main
# it then asks smart-avvik-deployment-config to deploy this run's image, the way entur/servicelinker
# hands over to its deployment config (entur/ror-tasks#45). That repository takes the image
# artifact from this run with entur/ror-gha-workflows' handover-image.yml, pushes it to Entur's
# registry and deploys it to dev, then tst and prd behind approvals.
#
# The dispatch uses DEPLOY_TRIGGER_TOKEN from the `deploy-trigger` environment: team-ror's shared
# token with Actions access to the deployment-config repositories (entur/ror-tasks#45 lists the
# repos that hold it; pat-expiry.yml warns before it expires). It is off until the repository
# variable DEPLOY_ON_MAIN is "true", so nothing deploys before the platform is ready. Pull requests
# never reach it, and pull requests from forks get no secrets at all.

name: Build

on:
  push:
    branches: [main]
    # A push that changes only these builds the same image, so there is nothing to deploy. The
    # image is built from demo/ and disruptions/api/; .dockerignore keeps the rest out. Only the push
    # trigger is filtered: a filtered pull request run never reports its checks, and a required
    # check that never reports blocks the merge.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/**'
      - 'notebooks/**'
      - 'eval/**'
      - '.claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The union of what ci.yml's jobs ask for: the test job writes checks, gha-docker's build asks
    # for id-token (unused here, since nothing trusts this repository's tokens), and gha-security's
    # scan comments on the pull request and uploads SARIF. Pull requests from forks get a read-only
    # token whatever this says.
    permissions:
      contents: write
      checks: write
      id-token: write
      issues: write
      pull-requests: write
      security-events: write
      actions: read
    secrets: inherit

  trigger-deploy:
    needs: [ci]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository_owner == 'entur' && vars.DEPLOY_ON_MAIN == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access, which
        # `gh workflow run`'s default-branch lookup cannot use. A missing run link must not fail
        # the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/smart-avvik-deployment-config/actions/workflows/cd.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/smart-avvik-deployment-config/actions/workflows/cd.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
