      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "639889291ec97a81bedb1c4c3581025d", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"hvor-bra-er-varslene-alle-operatrer\"\u003EHvor bra er varslene? (Alle operat\u00f8rer)\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EKort fortalt:\u003C/strong\u003E den all-operat\u00f8r-poolede modellfamilien (\u003Ccode\u003E*_pooled_all\u003C/code\u003E, 13 operat\u00f8rer:\nNSB/GOA p\u00e5 skinner + KOL, SOF, NOR, SKY, ATB, OST, FIN, MOR, RUT, TRO, GCO p\u00e5 buss/lokal)\nevaluert per operat\u00f8r p\u00e5 det temporale holdout-settet (\u003Ccode\u003Eis_eval = TRUE\u003C/code\u003E, onset \u2265 2026-04-01)\ni \u003Ccode\u003Edisruptions.training_calls_pooled_all\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESk\u00e5ringen speiler \u003Ccode\u003Edata/queries/eval_pooled_all_models.sql\u003C/code\u003E: r\u00e5 \u003Ccode\u003EML.PREDICT\u003C/code\u003E-sannsynligheter\nrekalibreres med de \u003Cstrong\u003Eoperat\u00f8r-bevisste\u003C/strong\u003E platt-lagene (\u003Ccode\u003Esigmoid(b + a\u00b7logit + w[operat\u00f8r])\u003C/code\u003E)\nog settes sammen som \u003Ccode\u003Ep_impact = p_cancel + (1 \u2212 p_cancel) \u00b7 P(\u226510)\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHovedfunn fra byggingen (docs/pooled-models-bus/LEARNINGS.md): buss-operat\u00f8rene f\u00e5r sterke\nmodeller (AUC 0.88\u20130.997, presisjon 0.84\u20130.96 @ 0.65), men NSB taper 0.4\u20130.5 AUC-poeng p\u00e5\nfortynning \u2014 paritets-gaten FEILET, s\u00e5 skinner og buss b\u00f8r serveres fra hver sin familie.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9217bf609bba4a9e70a54eeb0bdcec44", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "245384af5c01732d0155dbcb08532fc4", "console": [], "id
