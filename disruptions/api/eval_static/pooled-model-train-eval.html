      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

            "session": {"cells": [{"code_hash": "26ebcba5da6868f0092e62877cb9887d", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"hvor-bra-er-varslene-vy-og-go-ahead\"\u003EHvor bra er varslene? (Vy og Go-Ahead)\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EKort fortalt:\u003C/strong\u003E forrige notatbok (\u003Ccode\u003Eimpact_eval.py\u003C/code\u003E) evaluerte varslene for Vy tog (NSB),\nfamilien som serverer i dag. Her sp\u00f8r vi: kan vi ta inn flere operat\u00f8rer ved \u00e5 trene \u003Cstrong\u003E\u00e9n\nfelles modellfamilie\u003C/strong\u003E, uten at det koster noe for NSB? F\u00f8rste kandidat er Go-Ahead (GOA,\nS\u00f8rlandsbanen/J\u00e6rbanen) \u2014 ogs\u00e5 tog, men bare ~2 % av treningsradene.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEksperimentet (docs/pooled-models/LEARNINGS.md, 2026-07-03): tren \u003Ccode\u003E*_pooled\u003C/code\u003E-familien p\u00e5\nNSB + GOA med \u003Ccode\u003Eoperator\u003C/code\u003E som egenskap, evaluer per operat\u00f8r p\u00e5 det temporale holdout-settet\n(\u003Ccode\u003Eis_eval = TRUE\u003C/code\u003E, onset \u2265 2026-04-01) i \u003Ccode\u003Edisruptions.training_calls_pooled\u003C/code\u003E, og \u003Cstrong\u003Egate p\u00e5\nNSB-paritet\u003C/strong\u003E: ingen serveringsendring hvis NSB taper m\u00e5lbart p\u00e5 poolingen.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EResultat: \u003Cstrong\u003Egaten PASSERTE.\u003C/strong\u003E NSB-differansene er \u2264 0,0004 AUC p\u00e5 alle hovedmetrikker\n(statistisk uavgjort), og GOA f\u00e5r sterke modeller umiddelbart (innstillings-AUC 0,986,\n~95 % presisjon ved 91\u201395 % dekning p\u00e5 serveringsterskelen 0,65). Neste notatbok\n(\u003Ccode\u003Epooled-model-bus-eval.py\u003C/code\u003E) tester samme id\u00e9 utvidet til buss \u2014 der \u003Cstrong\u003Efeiler\u003C/strong\u003E gaten,\nog arkitekturen ender som to familier.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "16d52a933078ee576c20679b7c0fb8b5", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "245384af5c01732d0155dbcb08532fc4", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ece5c715adc44ae60dad6ea7aa1e7719", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"hva-ble-bygget\"\u003EHva ble bygget\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EArtefakt\u003C/th\u003E\n\u003Cth\u003ESkript\u003C/th\u003E\n\u003Cth\u003ENotat\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edisruptions.goa_calls\u003C/code\u003E (833k stopp, 60k avganger)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/queries/create_goa_calls.sql\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Erail_calls-formet, fra \u003Ccode\u003Elast_recorded\u003C/code\u003E (\u003Ccode\u003EdataSource='GOA' AND vehicleMode='rail'\u003C/code\u003E), vindu 2025-02-25 \u2192 2026-06-20\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edisruptions.training_calls_pooled\u003C/code\u003E (1,34M rader)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/queries/create_training_calls_pooled.sql\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etraining_calls-logikken + \u003Ccode\u003Eoperator\u003C/code\u003E-egenskap; per-operat\u00f8r calls-join\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E11 \u003Ccode\u003E*_pooled\u003C/code\u003E-modeller\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/queries/train_call_models_pooled.sql\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eidentiske kontrakter + \u003Ccode\u003Eoperator\u003C/code\u003E; tunede cancel-opsjoner\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E9 \u003Ccode\u003E*_platt_pooled\u003C/code\u003E-lag\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/queries/create_pooled_calibration.sql\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eett delt fitt p\u00e5 det poolede holdout-settet\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EEval\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/queries/eval_pooled_models.sql\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E3 familier \u00d7 3 metrikker \u00d7 operat\u00f8r\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EN\u00f8kkelfakta fra byggingen:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EGOA finnes bare fra mars 2025\u003C/strong\u003E i \u003Ccode\u003Elast_recorded\u003C/code\u003E (\u003Ccode\u003EGOA:DatedServiceJourney:\u003C/code\u003E-refer) \u2014\n  ingenting merket eksisterer tidligere, i noen kilde (census-funn). Erstatningsbusser\n  skiller seg rent ut som \u003Ccode\u003EServiceJourney\u003C/code\u003E + \u003Ccode\u003Ebus\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EJoinen er skopet \u003Ccode\u003E(operator, jkey)\u003C/code\u003E\u003C/strong\u003E \u2014 DatedServiceJourney-numeriske id-er er ikke\n  garantert unike p\u00e5 tvers av kodespaces, og kryss-operat\u00f8r-lekkasje av fasit m\u00e5 v\u00e6re umulig.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003Ecategory\u003C/code\u003E trengte null arbeid\u003C/strong\u003E: \u003Ccode\u003Edisruptions.categories\u003C/code\u003E dekker allerede 99,7 % av\n  GOA-onset-tekstene (delte meldingsmaler).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETotalkostnad \u2248 $1,6\u003C/strong\u003E (trening $1,40, GOA-tabellen $0,10) og ~40 min vegg-tid.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8b3738158428810d16fbf0af39928b69", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"tre-familier-a-sammenlikne\"\u003ETre familier \u00e5 sammenlikne\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESk\u00e5ringen speiler \u003Ccode\u003Edata/queries/eval_pooled_models.sql\u003C/code\u003E \u2014 samme metrikk-pipeline som\n\u003Ccode\u003Eimpact_eval.py\u003C/code\u003E: r\u00e5 \u003Ccode\u003EML.PREDICT\u003C/code\u003E-sannsynligheter platt-rekalibreres (lukket form fra\n\u003Ccode\u003EML.WEIGHTS\u003C/code\u003E) og settes sammen som \u003Ccode\u003Ep_impact = p_cancel + (1 \u2212 p_cancel) \u00b7 P(\u226510)\u003C/code\u003E.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003Epooled\u003C/strong\u003E \u2014 \u003Ccode\u003E*_pooled\u003C/code\u003E-modellene + \u003Ccode\u003E*_platt_pooled\u003C/code\u003E-lagene p\u00e5 det poolede holdout-settet,\n  evaluert per operat\u00f8r. Dette er kandidaten.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Eprod\u003C/strong\u003E \u2014 dagens NSB-modeller p\u00e5 NSB-holdouten: \u003Cstrong\u003Eparitets-baselinen\u003C/strong\u003E, regnet p\u00e5 nytt i\n  n\u00f8yaktig samme pipeline (ikke sitert fra dokumentasjon).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Ezeroshot\u003C/strong\u003E \u2014 dagens NSB-modeller anvendt \u003Cem\u003Eblindt\u003C/em\u003E p\u00e5 GOA-radene: hva GOA ville f\u00e5tt\n  gratis uten pooling (ukjente GOA-linjer/stopp faller til tr\u00e6rnes default-grener).\n  Gapet pooled \u2212 zeroshot er verdien av selve poolingen.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENSB-radene i den poolede tabellen er bit-identiske med \u003Ccode\u003Etraining_calls\u003C/code\u003E (1 055 196 trenings- /\n262 647 holdout-rader), s\u00e5 pooled-vs-prod-differansen p\u00e5 NSB m\u00e5ler modellene, ikke dataene.\nPlatt-laget for den poolede familien er \u003Cstrong\u003Eett delt fitt\u003C/strong\u003E p\u00e5 det poolede holdout-settet\n(~95 % NSB-rader) \u2014 kalibreringsavsnittet under sjekker om GOA rir den kurven akseptabelt.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b281595c219438914bb1b460e1a4de27", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='64a38ec4-9687-0145-b47a-02d1da6041a8'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;pooled\u0026#92;\u0026quot;,\u0026#92;\u0026quot;operator\u0026#92;\u0026quot;:\u0026#92;\u0026quot;GOA\u0026#92;\u0026quot;,\u0026#92;\u0026quot;holdout-rader\u0026#92;\u0026quot;:5420},{\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;pooled\u0026#92;\u0026quot;,\u0026#92;\u0026quot;operator\u0026#92;\u0026quot;:\u0026#92;\u0026quot;NSB\u0026#92;\u0026quot;,\u0026#92;\u0026quot;holdout-rader\u0026#92;\u0026quot;:262647},{\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;prod\u0026#92;\u0026quot;,\u0026#92;\u0026quot;operator\u0026#92;\u0026quot;:\u0026#92;\u0026quot;NSB\u0026#92;\u0026quot;,\u0026#92;\u0026quot;holdout-rader\u0026#92;\u0026quot;:262647},{\u0026#92;\u0026quot;family\u0026#92;\u0026quot;:\u0026#92;\u0026quot;zeroshot\u0026#92;\u0026quot;,\u0026#92;\u0026quot;operator\u0026#92;\u0026quot;:\u0026#92;\u0026quot;GOA\u0026#92;\u0026quot;,\u0026#92;\u0026quot;holdout-rader\u0026#92;\u0026quot;:5420}]\u0026quot;' data-total-rows='4' data-total-columns='1' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;holdout-rader\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[[\u0026quot;family\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;operator\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]]]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "4a3651f7c919263505d4b42d3c94b52d", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1b630f60ab8725ca2120a2e9f8e4f1b9", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"hovedtabellen-tre-familier-to-operatrer-tre-metrikker\"\u003EHovedtabellen: tre familier, to operat\u00f8rer, tre metrikker\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESamme m\u00e5ltall som i forrige notatbok (AUC, presisjon og dekning ved serveringsterskelen\n0,65), n\u00e5 per \u003Cstrong\u003Efamilie \u00d7 operat\u00f8r\u003C/strong\u003E. \u003Ccode\u003Ecancel\u003C/code\u003E = P(innstilt) mot faktisk innstilling;\n\u003Ccode\u003Eimpact_*\u003C/code\u003E = sammensatt p_impact mot innstilt ELLER \u2265 10 min forsinkelse, p\u00e5 kvalifiserte\nstopp (ankomst: ikke-origin; avgang: ikke-terminal).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELes tabellen som to sp\u00f8rsm\u00e5l:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EKoster poolingen noe for NSB?\u003C/strong\u003E Sammenlikn \u003Ccode\u003ENSB/pooled\u003C/code\u003E mot \u003Ccode\u003ENSB/prod\u003C/code\u003E \u2014 radene skal\n   v\u00e6re like.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EHva vinner GOA p\u00e5 pooling?\u003C/strong\u003E Sammenlikn \u003Ccode\u003EGOA/pooled\u003C/code\u003E mot \u003Ccode\u003EGOA/zeroshot\u003C/code\u003E \u2014 gapet er\n   verdien av \u00e5 trene med GOA-radene inne.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"} n\u003Ctd\u003E0,649\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E0,967\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E0,948\u003C/td\u003E\n\u003Ctd\u003E0,911\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eimpact_dep\u003C/td\u003E\n\u003Ctd\u003Ezeroshot\u003C/td\u003E\n\u003Ctd\u003EGOA\u003C/td\u003E\n\u003Ctd\u003E4 973\u003C/td\u003E\n\u003Ctd\u003E0,649\u003C/td\u003E\n\u003Ctd\u003E0,930\u003C/td\u003E\n\u003Ctd\u003E0,888\u003C/td\u003E\n\u003Ctd\u003E0,924\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eimpact_dep\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003Epooled\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003ENSB\u003C/td\u003E\n\u003Ctd\u003E245 176\u003C/td\u003E\n\u003Ctd\u003E0,189\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E0,923\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E0,909\u003C/td\u003E\n\u003Ctd\u003E0,567\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eimpact_dep\u003C/td\u003E\n\u003Ctd\u003Eprod\u003C/td\u003E\n\u003Ctd\u003ENSB\u003C/td\u003E\n\u003Ctd\u003E245 176\u003C/td\u003E\n\u003Ctd\u003E0,189\u003C/td\u003E\n\u003Ctd\u003E0,923\u003C/td\u003E\n\u003Ctd\u003E0,911\u003C/td\u003E\n\u003Ctd\u003E0,567\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENSB-paritet er eksakt \u2014 gaten passerte.\u003C/strong\u003E Differansene pooled \u2212 prod er \u2264 0,0004 AUC p\u00e5\n  alle tre hovedmetrikker (statistisk uavgjort). \u00c5 legge GOA (2 % av radene) i treningen\n  endrer ingenting for NSB.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGOA f\u00e5r sterke modeller umiddelbart.\u003C/strong\u003E Innstillings-AUC 0,986, p_impact-AUC ~0,97 begge\n  sider, og p\u00e5 serveringsterskelen ~95 % presisjon ved 91\u201395 % dekning. GOA leser \u003Cem\u003Elettere\u003C/em\u003E\n  enn NSB fordi situasjonene er journey-skopede innstillingsmeldinger: 51 % av ber\u00f8rte stopp\n  innstilt og 65 % rammet, mot NSBs 10 %/19 % \u2014 modellen trenger mest \u00e5 lese\n  \u003Ccode\u003Estatus\u003C/code\u003E/journey-skopet riktig.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPooling sl\u00e5r zero-shot klart.\u003C/strong\u003E Dagens NSB-modeller anvendt blindt p\u00e5 GOA klarer\n  0,93\u20130,94 impact-AUC (egenskapene overf\u00f8res!), men poolingen legger p\u00e5 ~+3 AUC-poeng og\n  +5\u20139 pp presisjon ved terskelen \u2014 det ukjente GOA-linjer/stopp koster i default-grener.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENSB-tallene her matcher forrige notatbok\u003C/strong\u003E (0,960 / 0,930 / 0,923, ~91 % presisjon) \u2014\n  metrikk-pipelinen er konsistent p\u00e5 tvers av evalueringene.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EForbehold\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EGOA-holdouten er liten: 461 situasjoner / ~5,4k stopp \u2192 AUC \u00b1 ~0,005.\u003C/li\u003E\n\u003Cli\u003EPlatt-lagene er tilpasset p\u00e5 samme holdout som evalueres (leser optimistisk) \u2014 men likt\n  for begge familier, s\u00e5 sammenlikningene er epler mot epler.\u003C/li\u003E\n\u003Cli\u003EJanuar 2026 er en produsentgap-m\u00e5ned for GOA (normale avgangstall, ~halvparten av\n  call-radene) \u2014 etikettene undertelles der.\u003C/li\u003E\n\u003Cli\u003EForsinkelses-regressorene ble trent for familie-kompletthet, men ikke evaluert separat\n  (svake hoder, R\u00b2 ~0,13 hos NSB); impact-stacken er gaten.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIkke gjort \u2014 porter f\u00f8r noen serveringsendring\u003C/strong\u003E\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EPer-horisont-platt-lag\u003C/strong\u003E (36 \u003Ccode\u003E*_platt_{lead60,120,240,plan}\u003C/code\u003E-modeller) finnes bare for\n   prod-familien; den poolede familien trenger samme refitt ved promotering.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EServeringsstien er NSB/VYG-hardkodet\u003C/strong\u003E: \u003Ccode\u003Edisruptions_today.sql\u003C/code\u003E\n   (\u003Ccode\u003EparticipantRef='NSB'\u003C/code\u003E), \u003Ccode\u003Erail_calls_*_today.sql\u003C/code\u003E (\u003Ccode\u003ElineRef LIKE 'VYG:%'\u003C/code\u003E),\n   \u003Ccode\u003Epredict_calls*.sql\u003C/code\u003E (modellnavn), \u003Ccode\u003Emain.py\u003C/code\u003E (\u003Ccode\u003EVYG:Line:\u003C/code\u003E-prefiks). Parameterisering er\n   en egen fase.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGOA-ledetid\u003C/strong\u003E besvares i neste notatbok: GOA har faktisk den beste meldingskulturen av\n   alle operat\u00f8rene (median ledetid +77 min; meldingen finnes \u2265 30 min f\u00f8r avgang for ~64 %\n   av avgangene).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPromoteringsbeslutningen\u003C/strong\u003E: pooled er uavgjort-eller-bedre for NSB, s\u00e5 \u00e9n felles familie\n   fristet \u2014 men \u003Cstrong\u003Ebuss-utvidelsen i neste notatbok feilet NSB-gaten\u003C/strong\u003E (63 % buss-rader\n   fortynner skinnesignalet), s\u00e5 arkitekturen endte som \u003Cstrong\u003Eto familier\u003C/strong\u003E: denne\n   skinnefamilien (NSB + GOA) og en egen buss/lokal-familie.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ERepro\u003C/strong\u003E (~$1,6 totalt): \u003Ccode\u003Ecreate_goa_calls.sql\u003C/code\u003E \u2192 \u003Ccode\u003Ecreate_training_calls_pooled.sql\u003C/code\u003E \u2192\n\u003Ccode\u003Etrain_call_models_pooled.sql\u003C/code\u003E \u2192 \u003Ccode\u003Ecreate_pooled_calibration.sql\u003C/code\u003E \u2192 \u003Ccode\u003Eeval_pooled_models.sql\u003C/code\u003E,\nalle i \u003Ccode\u003Edata/queries/\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.13", "script_metadata_hash": null}, "version": "1"},
