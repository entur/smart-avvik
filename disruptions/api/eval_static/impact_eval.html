      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "8d7257d7e1b39cdf07d5c4194236c6fd", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"hvor-bra-er-varslene-kun-vy-tog\"\u003EHvor bra er varslene? (kun Vy tog)\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EKort fortalt:\u003C/strong\u003E mens en avviksmelding er aktiv \u2014 hvor godt klarer vi \u00e5 forutsi hvilke\nstopp passasjerene faktisk vil merke det p\u00e5: et innstilt tog, eller et tog som er\n10+ minutter forsinket?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEvaluerer de serverte sannsynlighetene \u003Cstrong\u003E\u003Ccode\u003Ep_impact\u003C/code\u003E\u003C/strong\u003E / \u003Cstrong\u003E\u003Ccode\u003Ep_impact_dep\u003C/code\u003E\u003C/strong\u003E (innstilling +\n\u226510 min forsinkelse) mot faktisk utfall p\u00e5 det temporale holdout-settet (\u003Ccode\u003Eis_eval = TRUE\u003C/code\u003E,\nonset \u2265 2026-04-01) i \u003Ccode\u003Edisruptions.training_calls\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESk\u00e5ringen speiler \u003Ccode\u003Edisruptions/api/predict_calls.sql\u003C/code\u003E: r\u00e5 \u003Ccode\u003EML.PREDICT\u003C/code\u003E-sannsynligheter\nplatt-rekalibreres (\u003Ccode\u003Ecancel_platt\u003C/code\u003E, \u003Ccode\u003Earr_ge10_platt\u003C/code\u003E, \u003Ccode\u003Edep_ge10_platt\u003C/code\u003E) og settes sammen som\n\u003Ccode\u003Ep_impact = p_cancel + (1 \u2212 p_cancel) \u00b7 P(\u226510)\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFasit: \u003Cstrong\u003Eankomstsiden\u003C/strong\u003E = innstilt ELLER ankomstforsinkelse \u2265 10 (avstigningsstopp);\n\u003Cstrong\u003Eavgangssiden\u003C/strong\u003E = innstilt ELLER avgangsforsinkelse \u2265 10 (p\u00e5stigningsstopp).\nBare rader der siden finnes (ikke origin/terminal) og utfallet er observert, telles med.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9217bf609bba4a9e70a54eeb0bdcec44", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "245384af5c01732d0155dbcb08532fc4", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0965645c24a92e391ed2ab1df70424f3", "console": [], "id": "bkHC", "outputs": [{"data": {"application/json": "[262647, 15]"}, "type": "data"}]}, {"code_hash": "e1f0a4ee86ccab734472712659a325f5", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8c58c5b7d7b7fa4d72c018db53b0ad3e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E\u0026#x27;ankomst: 250,697 rader | avgang: 245,176 rader\u0026#x27;\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "d9a4c99870fab1836ece0dd915be13ed", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"slik-leser-du-tallene\"\u003ESlik leser du tallene\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EHver rad i dataene er ett \u003Cstrong\u003Etogstopp\u003C/strong\u003E \u2014 ett tog p\u00e5 ett stopp \u2014 som ligger innenfor vinduet\ntil en aktiv avviksmelding. For hvert stopp gir modellen en sannsynlighet for at en passasjer\np\u00e5 stoppet blir \u003Cstrong\u003Erammet\u003C/strong\u003E: toget er innstilt, eller det er \u2265 10 minutter forsinket.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003Eandel rammet\u003C/strong\u003E \u2014 hvor ofte det faktisk skjedde (rundt 19 % av stoppene i denne perioden).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Esnittprediksjon\u003C/strong\u003E \u2014 gjennomsnittssannsynligheten modellen ga. N\u00e5r den treffer andelen\n  rammet, er modellen \u00e6rlig \u003Cem\u003Ei snitt\u003C/em\u003E: verken alarmistisk eller sovende.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAUC\u003C/strong\u003E \u2014 trekk ett rammet og ett urammet stopp tilfeldig; AUC er sjansen for at modellen\n  ga det rammede stoppet h\u00f8yest sannsynlighet. 0,5 er myntkast, 1,0 er perfekt.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9ec5df25f730035fc851719c422193bb", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='SFPL-0' random-id='7aa445d9-9e38-2496-47f3-6b438723aedd'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;side\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ankomst (p_impact)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;antall stopp\u0026#92;\u0026quot;:250697,\u0026#92;\u0026quot;andel rammet\u0026#92;\u0026quot;:0.1872,\u0026#92;\u0026quot;snittprediksjon\u0026#92;\u0026quot;:0.1871,\u0026#92;\u0026quot;AUC\u0026#92;\u0026quot;:0.9304},{\u0026#92;\u0026quot;side\u0026#92;\u0026quot;:\u0026#92;\u0026quot;avgang (p_impact_dep)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;antall stopp\u0026#92;\u0026quot;:245176,\u0026#92;\u0026quot;andel rammet\u0026#92;\u0026quot;:0.1891,\u0026#92;\u0026quot;snittprediksjon\u0026#92;\u0026quot;:0.1904,\u0026#92;\u0026quot;AUC\u0026#92;\u0026quot;:0.9234}]\u0026quot;' data-total-rows='2' data-total-columns='5' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;side\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;antall stopp\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]],[\u0026quot;andel rammet\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;snittprediksjon\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;AUC\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]]]' data-show-filters='true' data-show-download='t ne (dekning),\nmen andelen riktige varsler (presisjon) faller. De markerte punktene viser terskelen 0,65 fra\ntabellene over.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EH\u00f8yre \u2014 betyr \u00ab70 %\u00bb faktisk 70 %?\u003C/strong\u003E Stoppene grupperes etter predikert sannsynlighet, og\nhvert punkt sammenlikner hva modellen \u003Cem\u003Esa\u003C/em\u003E med hvor ofte passasjerer \u003Cem\u003Efaktisk\u003C/em\u003E ble rammet i\ngruppen. En \u00e6rlig modell ligger p\u00e5 den stiplede diagonalen. (En klype salt: kalibreringslaget\nble tilpasset p\u00e5 den samme evalueringsperioden, s\u00e5 figuren ser litt bedre ut enn den ville\ngjort p\u00e5 helt ferske data \u2014 se forbeholdene nederst.)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "355329d2a37ca9611c3303689385aef0", "console": [], "id": "emfo", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHMAAAHWCAYAAAD0PMWNAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlcelbwAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzsnQV8FEcbxp9c3JUoENzd3d2lBUqBGrTU/asbdTdaarS0pQVK0eLu7u6QQNzd777fM+GOS3KBJCTkkrx/us2tz87c7c4+84qFTqfTQRAEQRAEQRAEQRAEQagQaMq7AIIgCIIgCIIgCIIgCELRETFHEARBEARBEARBEAShAiFijiAIgiAIgiAIgiAIQgVCxBxBEARBEARBEARBEIQKhIg5giAIgiAIgiAIgiAIFQgRcwRBEARBEARBEARBECoQIuYIgiAIgiAIgiAIgiBUIETMEQRBEARBEARBEARBqECImCMIgiAIgiAIgiAIglCBEDFHuKOcO3cOv/zyCxISEkyuz8rKwuzZs3HkyJEyK8PFixdVGQqbv9OcOXMGv//++x05lzldu06nw/bt29W1L1u2rELXqzliTm19pyitNv/7779x/PjxUimTIAiVg+TkZHUP1U/z5s3D/v371bOsrDh//jzmzJmTZ9ny5cuxe/duw/zixYtVOYTy5cqVK+p7kZOTY3K+OG3+66+/llEpKw9Frd/Sqs8FCxbkeTfJP19U5s6di5MnT952eQRBj4g5wh3F1tYWDz/8sHpZMsV///2HqVOnIi0trczKwE7QtGnTCp2/02zZsgWPP/74HTnXra79dh56xd33nnvuweTJk9X1l8WL852sV3OkvL/n5dEhLa02f+6557B27dpSKZMgCJWD6OhodQ/966+/sGfPHixZsgQDBw5Ely5d1LqyYOfOnZg+fXqeZR988IEqg54333wTixYtKpPzX7p0Sb0wl6VgVVk4cOCA+n5wUNLUfHHanP3kytZ+pV2WotZvadXnSy+9hBUrVhQ6X d\u003E\n\u003Ctd\u003E250 697\u003C/td\u003E\n\u003Ctd\u003E0,187\u003C/td\u003E\n\u003Ctd\u003E0,187\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E0,930\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eavgang \u003Ccode\u003Ep_impact_dep\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E245 176\u003C/td\u003E\n\u003Ctd\u003E0,189\u003C/td\u003E\n\u003Ctd\u003E0,190\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E0,923\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003EVed terskel \u003Cstrong\u003E0,65\u003C/strong\u003E gir ankomstvarselet \u003Cstrong\u003E91,2 % presisjon @ 58,9 % dekning\u003C/strong\u003E \u2014 det tidligere\n  dokumenterte driftspunktet (91 % @ 32 %, f\u00f8r promoteringen) har nesten doblet dekningen ved\n  samme presisjon, i tr\u00e5d med den tunede \u003Ccode\u003Ecall_cancel_clf\u003C/code\u003E promotert 2026-07-03\n  (AUC 0,885 \u2192 0,960).\u003C/li\u003E\n\u003Cli\u003EAvgangssiden ligger ~2 prosentpoeng bak ankomstsiden gjennom hele terskelsveipet.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EForbehold\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EPlatt-lagene (\u003Ccode\u003Ecancel_platt\u003C/code\u003E, \u003Ccode\u003E*_ge10_platt\u003C/code\u003E) ble \u003Cstrong\u003Etilpasset p\u00e5 det samme holdout-settet\u003C/strong\u003E\n  (\u003Ccode\u003Etrain_call_models.sql\u003C/code\u003E), s\u00e5 kalibreringsfiguren er in-sample for kalibreringslaget og leser\n  optimistisk. Rangeringsm\u00e5l (AUC, PR-kurvens form) p\u00e5virkes i praksis ikke; terskel-forankret\n  presisjon/dekning kan flytte seg noe p\u00e5 helt ferske data.\u003C/li\u003E\n\u003Cli\u003EStopp uten observert utfall (ingen registrert forsinkelse, ikke innstilt) er utelatt; hvis\n  manglende data korrelerer med p\u00e5virkning, er de realiserte ratene en nedre grense.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5f2f7ce3bed9da15176af60a74061768", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"hvor-tidlig-kan-vi-varsle\"\u003EHvor tidlig kan vi varsle?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESp\u00f8rsm\u00e5let over evaluerer varsling ~30 minutter f\u00f8r avgang (slik treningsdataene er forankret:\ntogets egen forsinkelse m\u00e5les ved siste stopp \u2265 30 min f\u00f8r, linjetilstanden i timen rundt\n60 min f\u00f8r). Her sp\u00f8r vi i stedet: \u003Cstrong\u003Ehvor mange minutter f\u00f8r planlagt avgang vet vi at avgangen\nblir innstilt eller \u2265 10 min forsinket?\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo ting begrenser hvor tidlig vi kan varsle:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003ETaket:\u003C/strong\u003E avviksmeldingen m\u00e5 finnes. Halvparten av de rammede avgangene har meldingen\n   mindre enn ~60 minutter f\u00f8r avgang \u2014 de kan ingen modell varsle tidligere om.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EInformasjonsforfall:\u003C/strong\u003E jo tidligere vi sp\u00f8r, jo mindre vet vi om togets og linjens\n   faktiske tilstand. Modellen faller gradvis tilbake til \u00abplanlegging framover\u00bb-regimet.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EMetode: holdout-settet re-sk\u00e5res med de samme modellene, men med de to sanntidsforankrede\negenskapene (\u003Ccode\u003Eown_prev_delay\u003C/code\u003E, \u003Ccode\u003Eline_now_*\u003C/code\u003E) beregnet som de ville sett ut \u003Cstrong\u003EL minutter f\u00f8r\navgang\u003C/strong\u003E, L \u2208 {30, 60, 120, 240}, pluss en \u00abved melding\u00bb-variant uten observerbar tog-/\nlinjetilstand (ren planlegging). L = 30 reproduserer treningsforankringen eksakt (verifisert:\n0 avvik mot \u003Ccode\u003Etraining_calls\u003C/code\u003E). Tabellen bygges av \u003Ccode\u003Edata/queries/leadtime_eval.sql\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bf743912aa95977f74425cae90169887", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E\u0026#x27;1,225,880 rader (5 lead-varianter)\u0026#x27;\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "ebaea1071c77bfa9eb38a5dff9666a9e", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ZHCJ-0' random-id='16d0c81e-e9ab-e6f3-b58a-b12f00779e25'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;sp\u0026#92;\u0026#92;u00f8rretidspunkt\u0026#92;\u0026quot;:\u0026#92;\u0026quot;30 min f\u0026#92;\u0026#92;u00f8r avgang\u0026#92;\u0026quot;,\u0026#92;\u0026quot;avganger\u0026#92;\u0026quot;:210704,\u0026#92;\u0026quot;AUC\u0026#92;\u0026quot;:0.916,\u0026#92;\u0026quot;dekning @90 % presisjon\u0026#92;\u0026quot;:0.552,\u0026#92;\u0026quot;terskel\u0026#92;\u0026quot;:0.624,\u0026#92;\u0026quot;tak (meldingen finnes)\u0026#92;\u0026quot;:0.689,\u0026#92;\u0026quot;andel av ALLE rammede varslet\u0026#92;\u0026quot;:0.38},{\u0026#92;\u0026quot;sp\u0026#92;\u0026#92;u00f8rretidspunkt\u0026#92;\u0026quot;:\u0026#92;\u0026quot;60 min f\u0026#92;\u0026#92;u00f8r avgang\u0026#92;\u0026quot;,\u0026#92;\u0026quot;avganger\u0026#92;\u0026quot;:175730,\u0026#92;\u0026quot;AUC\u0026#92;\u0026quot;:0.828,\u0026#92;\u0026quot;dekning @90 % presisjon\u0026#92;\u0026quot;:0.314,\u0026#92;\u0026quot;terskel\u0026#92;\u0026quot;:0.884,\u0026#92;\u0026quot;tak (meldingen finnes)\u0026#92;\u0026quot;:0.485,\u0026#92;\u0026quot;andel av ALLE rammede varslet\u0026#92;\u0026quot;:0.152},{\u0026#92;\u0026quot;sp\u0026#92;\u0026#92;u00f8rretidspunkt\u0026#92;\u0026quot;:\u0026#92;\u0026quot;120 min f\u0026#92;\u0026#92;u00f8r avgang\u0026#92;\u0026quot;,\u0026#92;\u0026quot;avganger\u0026#92;\u  minutter f\u00f8r avgang, og 30 minutter f\u00f8r avgang. Hver kurve\nbruker avgangene som er n\u00e5bare p\u00e5 sitt tidspunkt (meldingen m\u00e5 finnes).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo ting \u00e5 se etter:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EVenstre:\u003C/strong\u003E kurven ligger lavere jo tidligere vi sp\u00f8r \u2014 med mindre informasjon m\u00e5 vi ofre\n  mer dekning for \u00e5 holde samme presisjon.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EH\u00f8yre:\u003C/strong\u003E sannsynlighetene er kalibrert for ~30-minuttersregimet. Sp\u00f8r vi tidligere, blir\n  modellen \u003Cstrong\u003Eoverkonfident\u003C/strong\u003E \u2014 punktene faller under diagonalen: n\u00e5r den sier \u00ab80 %\u00bb, rammes\n  f\u00e6rre enn 80 %. Det er derfor terskelen m\u00e5 heves (0,62 \u2192 0,86\u20130,88) for \u00e5 holde 90 %\n  presisjon ved tidlig varsling.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7295b8c7aedbba2b60e175e40c370f36", "console": [], "id": "TqIu", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABHMAAAHWCAYAAAD0PMWNAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlcelbwAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzsnQd0FFUbht+t6Y2EVAKE3nuX3pGONAHBgl0sqAiIIjYUK7+oiKhYaVJFpPfee29JSO892fqf7y672YSEbOruJt9zzpydO/Xund2ZO+/9ikSv1+vBMAzDMAzDMAzDMAzD2AVSa1eAYRiGYRiGYRiGYRiGsRwWcxiGYRiGYRiGYRiGYewIFnMYhmEYhmEYhmEYhmHsCBZzGIZhGIZhGIZhGIZh7AgWcxiGYRiGYRiGYRiGYewIFnMYhmEYhmEYhmEYhmHsCBZzGIZhGIZhGIZhGIZh7AgWcxiGYRiGYRiGYRiGYewIFnMYhmEYhmEYhmEYhmHsCBZzGJvl77//xo4dOwpdf+LECfz000/QarXlVoe1a9fi+PHjhZYrmpUrV+LMmTMVci5b++5M6bl06RJ+//33B26j1+uxdOlS3Llzx+ab/Ny5c1i+fLm1q8EwTBUgPT1d3BuNE9176JlI98zy4vr161i2bFmeZRs3bsThw4dNZX422wb0zKTfhbFPmr9cnGv+888/l1MtKw+Wtm9ZtWf+/ndJ++N//PEHLl68WOr6MIwRFnMYm2XXrl149NFHoVarC1z/wgsv4LfffoNMJiu3Orz77rtYs2ZNoeWK5q233sKmTZsq5FxFfXcS206 sont\u003C/th\u003E\n\u003Cth\u003Edekning blant n\u00e5bare\u003C/th\u003E\n\u003Cth\u003Eandel av \u003Cem\u003Ealle\u003C/em\u003E rammede\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E30 min f\u00f8r avgang\u003C/td\u003E\n\u003Ctd\u003E55 %\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E38 %\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E60 min f\u00f8r avgang\u003C/td\u003E\n\u003Ctd\u003E31 %\u003C/td\u003E\n\u003Ctd\u003E15 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2 t f\u00f8r avgang\u003C/td\u003E\n\u003Ctd\u003E19 %\u003C/td\u003E\n\u003Ctd\u003E5 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4 t f\u00f8r avgang\u003C/td\u003E\n\u003Ctd\u003E17 %\u003C/td\u003E\n\u003Ctd\u003E1,7 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eved melding (plan-regime)\u003C/td\u003E\n\u003Ctd\u003E27 %\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003E27 %\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003ETo ting begrenser tidlig varsling, omtrent like mye:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EMeldingen kommer sent.\u003C/strong\u003E Median rammet avgang har avviksmeldingen bare ~57 min f\u00f8r\n   planlagt avgang; kun 26 % har den \u2265 2 t f\u00f8r. Ingen modell kan varsle f\u00f8r meldingen finnes.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EInformasjonen forfaller.\u003C/strong\u003E P\u00e5 samme avganger (tak \u2265 4 t) faller dekningen ved 90 %\n   presisjon fra 51 % (spurt 30 min f\u00f8r) til 17 % (spurt 4 t f\u00f8r) \u2014 nesten ned til gulvet p\u00e5\n   19 % med kun meldingsinfo. Modellens sterkeste signal er togets egen observerte forsinkelse\n   og linjetilstanden siste time, og de finnes ikke lenger enn ~1 t fram i tid.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EProduktimplikasjon:\u003C/strong\u003E en to-trinns strategi ser riktig ut \u2014 varsle straks meldingen kommer\nmed h\u00f8y terskel (0,86; fanger 27 % med 90 % presisjon, typisk planlagte innstillinger), og\nre-vurder alle avganger l\u00f8pende slik at de resterende fanges ~30\u201360 min f\u00f8r avgang (terskel\n~0,62). Dagens serving gj\u00f8r i praksis det siste allerede.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EForbehold:\u003C/strong\u003E tersklene per horisont er valgt p\u00e5 samme data (optimistisk); \u003Ccode\u003Eline_now\u003C/code\u003E-b\u00f8tta\narver ~30 min slingring fra treningen; gjentatte varsler per avgang gir samlet sett litt\nlavere presisjon enn 90 % per sp\u00f8rring. Tabellen bygges av \u003Ccode\u003Edata/queries/leadtime_eval.sql\u003C/code\u003E\n(lead 30 verifisert identisk med treningsforankringen).\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0835f35a8c38cb7fa3ba8f650ac6119d", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"egne-platt-lag-per-sprretidspunkt\"\u003EEgne platt-lag per sp\u00f8rretidspunkt\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EForrige avsnitt viste problemet: sannsynlighetene er kalibrert for ~30-minuttersregimet.\nSp\u00f8r vi tidligere, er modellen \u003Cstrong\u003Eoverkonfident\u003C/strong\u003E, og terskelen for 90 % presisjon m\u00e5 heves\nfra 0,62 til 0,86\u20130,88. Samme tall betyr da forskjellige ting p\u00e5 ulike tidspunkter, og\ntidligvarsling blir upraktisk \u00e5 styre.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EL\u00f8sningen: ett platt-lag (logistisk rekalibrering av r\u00e5 modellscore) \u003Cstrong\u003Eper sp\u00f8rrehorisont\u003C/strong\u003E\nog per modellhode (innstilling og \u2265 10 min forsinkelse). Horisonter: ved melding (plan),\n240, 120, 60 og 30 min f\u00f8r avgang \u2014 30-minutterslaget er dagens produksjonskalibrering.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\u00c6rlig evaluering:\u003C/strong\u003E koeffisientene tilpasses kun p\u00e5 hendelser med start 1. april\u201315. mai\n(del A) og testes p\u00e5 hendelser fra 16. mai og utover (del B), som verken modellhodene eller\nplatt-lagene har sett. Produksjonslagene i BigQuery (\u003Ccode\u003Ecancel_platt_lead*\u003C/code\u003E,\n\u003Ccode\u003Edep_ge10_platt_lead*\u003C/code\u003E, se \u003Ccode\u003Edata/queries/create_leadtime_calibration.sql\u003C/code\u003E) tilpasses p\u00e5 hele\nholdout-vinduet etterp\u00e5.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "48f2a0c1ce6696c2f01619289b313def", "console": [], "id": "ulZA", "outputs": [{"data": {"text/html": "\u003Cpre class='text-xs'\u003E\u0026#x27;861,007 rader; del A (tilpasning): 51%\u0026#x27;\u003C/pre\u003E"}, "type": "data"}]}, {"code_hash": "3c663bf35b6f2555ffcedddb6ddb5c7b", "console": [], "id": "ecfG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ecfG-0' random-id='efd45d5d-e939-ba85-fa65-acfe10d20fca'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;lead_min\u0026#92;\u0026quot;:-1,\u0026#92;\u0026quot;a_cancel\u0026#92;\u0026quot;:0.792,\u0026#92;\u0026quot;b_cancel\u0026#92;\u0026quot;:-1.264,\u0026#92;\u0026quot;a_dep10\u0026#92;\u0026quot;:0.896,\u0026#92;\u0026quot;b_dep10\u0026#92;\u0026quot;:0.248},{\u0026#92;\u0026quot;lead_min\u0026#92;\u0026quot;:30,\u0026#92;\u0026quot;a_cancel\u0026#92;\u0026quot;:1.059,\u0026#92;\u0026quot;b_cancel\u0026#92;\u0026quot;:0.228,\u0026#92;\u0026quot;a_dep10\u0026#92;\u0026quot;:1.083,\u0026#92;\u0026quot;b_dep10\u0026#92;\u0026quot;:-0.292},{\u0026#92;\u0026quot;lead_min\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;a_cancel\u0026#92;\u0026quot;:0.709,\u0026#92;\u0026quot;b_cancel\u0026#92;\u0026quot;:-1.137,\u0026#92;\u0026quot;a_dep10\u0026#92;\u00 KHEIIIYQQQgghhBA/gsocQgghhBBCCCGEED+CyhxCCCGEEEIIIYQQP4LKHEIIIYQQQgghhBA/gsocQgghhBBCCCGEED+CyhxCCCGEEEIIIYQQP4LKHEIIIYQQQgghhBA/gsocQgghhBBCCCGEEPEf/g9h7GzXlkvZNgAAAABJRU5ErkJggg==\", \"__metadata__\": {\"image/png\": {\"width\": 1139, \"height\": 470}}}"}, "type": "data"}]}, {"code_hash": "8373206d6c83d149e8f746159d42eb0b", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"funn-egne-platt-lag-gjr-tidligvarsling-styrbar\"\u003EFunn: egne platt-lag gj\u00f8r tidligvarsling styrbar\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ERangeringen er uendret\u003C/strong\u003E (platt-laget er monotont), men sannsynlighetene blir \u00e6rlige:\n  snitt predikert p p\u00e5 del B treffer n\u00e5 andelen rammede p\u00e5 alle horisonter (f.eks. 240 min\n  f\u00f8r: 0,14 \u2192 0,09 mot reelt 0,07; ved melding: 0,23 \u2192 0,19 mot 0,17).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u00c9n fast terskel fungerer p\u00e5 tvers av horisonter.\u003C/strong\u003E Med dagens felles lag gir terskel 0,65\n  alt fra 47 % til 94 % presisjon avhengig av n\u00e5r man sp\u00f8r; med eget lag per horisont gir\n  samme terskel \u003Cstrong\u003E\u2265 91 % presisjon overalt\u003C/strong\u003E. Terskelen som trengs for 90 % presisjon samler\n  seg rundt 0,48\u20130,63 i stedet for \u00e5 spre seg 0,53\u20130,96.\u003C/li\u003E\n\u003Cli\u003EKoeffisientene viser mekanikken: jo tidligere horisonten er, desto mer krymper laget\n  sk\u00e5rene mot basisraten (a \u0026lt; 1) og skyver dem ned (b \u0026lt; 0) \u2014 n\u00f8yaktig den overkonfidensen\n  forrige avsnitt p\u00e5viste.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EProduksjon:\u003C/strong\u003E \u003Ccode\u003Edata/queries/create_leadtime_calibration.sql\u003C/code\u003E tilpasser lag p\u00e5 hele\n  holdout-vinduet for \u003Cstrong\u003Ealle ni modellhodene\u003C/strong\u003E (kansellering + arr/dep ge5\u2013ge40):\n  \u003Ccode\u003E*_platt_{lead60,lead120,lead240,plan}\u003C/code\u003E i BigQuery. Servering (\u003Ccode\u003Epredict_calls.sql\u003C/code\u003E)\n  velger lag per avgang etter minutter til avgang ved sp\u00f8rretidspunktet (\u0026lt; 45 min \u2192\n  dagens lag; grenser 90/180/360; \u0026gt; 6 t \u2192 plan-laget) for varsler, ge-kolonner og\n  intervaller, med samme lukkede form \u003Ccode\u003Esigmoid(b + a\u00b7logit(p_r\u00e5))\u003C/code\u003E som f\u00f8r. Samme\n  A/B-sjekk p\u00e5 ankomstsiden: presisjon ved fast terskel 0,65 gikk fra 0,38\u20130,93 til\n  0,87\u20130,94, og ge5-hodene (som fellelaget \u003Cem\u003Eunder\u003C/em\u003E-predikerte tidlig, 0,085 mot reelt\n  0,200 ved melding) treffer n\u00e5 basisraten. Lagene m\u00e5 re-tilpasses etter hver\n  hodetrening, som de eksisterende.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.13", "script_metadata_hash": null}, "version": "1"},
