<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- Brand-neutral by construction: the heading names Avviksvarsel and not Entur, so this one
         title is right in both variants and the page needs no /config round trip to set it. -->
    <title>Personvern i Avviksvarsel</title>

    <!-- The second Vite entry (see vite.config.ts). The inline script below and the head links
         after it are a DELIBERATE COPY of index.html, not a shared partial: Vite has no HTML
         include, and an entry document without them would paint the Entur palette for a
         `?brand=none` visitor — on the one page whose job is telling them who the controller is.
         The script is byte-identical to index.html's and a parity test asserts it stays that way,
         because nothing else detects the drift. -->

    <!-- Brand, ahead of everything else. `?brand=none` renders the unbranded variant; no parameter
         renders Entur, which is what the rest of this file is written for. Set from an inline
         script rather than from the React bundle because it has to be in place before FIRST PAINT
         — every rule in src/brands/*.css keys on this attribute, so applying it later would show
         the Entur palette and then swap it. src/brand.ts re-applies it (and corrects a slug no
         brand exists for) once the bundle runs. -->
    <script>
      (function () {
        try {
          var requested = new URLSearchParams(location.search).get('brand');
          document.documentElement.dataset.brand = /^[a-z][a-z0-9-]{0,23}$/.test(requested || '')
            ? requested
            : 'entur';
        } catch (e) {
          document.documentElement.dataset.brand = 'entur';
        }
      })();
    </script>
    <meta name="description" content="Slik behandler Entur AS opplysninger i Avviksvarsel." />

    <!-- Entur is the default brand, so its assets are the ones written literally here: they load
         without waiting for the bundle. src/brand.ts repoints all of them for another brand. -->
    <!-- Favicon (Entur logo mark; see scripts/make_icons.py) -->
    <link rel="icon" href="/varsel/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/varsel/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/varsel/favicon-16.png" sizes="16x16" type="image/png" />

    <!-- PWA. The page is inside the app's scope, so an installed app opens it in-app — which is
         also why the page carries its own «Tilbake til Avviksvarsel» link (there is no browser
         chrome to go back with). -->
    <link rel="manifest" href="/varsel/manifest.webmanifest" />
    <meta name="theme-color" content="#181c56" />

    <!-- iOS: add-to-home-screen (required for Web Push on iOS >= 16.4) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Avviksvarsel" />
    <link rel="apple-touch-icon" href="/varsel/icons/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/personvern-page.tsx"></script>
  </body>
</html>
